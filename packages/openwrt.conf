# OpenWrt 第三方插件配置
# 每行一个包，格式：CONFIG_PACKAGE_包名=y
# 此文件在 diy-part2.d/openwrt.sh 中自动追加到 .config
CONFIG_PACKAGE_luci-app-run=y
CONFIG_PACKAGE_mihomo-meta=y
CONFIG_PACKAGE_nikki=y
CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
CONFIG_PACKAGE_luci-app-nikki=y
CONFIG_PACKAGE_luci-app-poweroffdevice=y
CONFIG_PACKAGE_luci-app-airoha-npu=y
CONFIG_PACKAGE_luci-i18n-airoha-npu-zh-cn=y
CONFIG_PACKAGE_xr1710g-status-core=y
CONFIG_PACKAGE_luci-app-xr1710g-recovery=y

# XR1710G iStoreOS community port core
CONFIG_PACKAGE_luci-app-store=y
CONFIG_PACKAGE_quickstart=y
CONFIG_PACKAGE_luci-app-quickstart=y
CONFIG_PACKAGE_luci-app-istorex=y
# The upstream full config enables tar's XZ feature. Kconfig requires the
# matching helper before it can retain luci-app-store's dependency tree.
CONFIG_PACKAGE_xz-utils=y

# iStoreOS-style presentation: iStoreX is the home shell, while Argon replaces
# Bootstrap on the ordinary LuCI settings pages.
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-argon-config=y

# OpenClash 0.47.133. The Meta core is installed by the immutable files
# overlay; OpenClash remains disabled until the user adds a subscription.
CONFIG_PACKAGE_luci-app-openclash=y

# PassWall2 26.8.20 with both maintained aarch64 cores and the firewall4-native
# nftables transparent-proxy path. Its upstream clean-install configuration
# keeps the proxy disabled; users should enable either PassWall2 or OpenClash,
# not both, because they share DNS and firewall interception paths.
CONFIG_PACKAGE_luci-app-passwall2=y
CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All=y
CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y
CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy=n
# Xray and sing-box already cover the modern client protocols. Keep duplicate
# standalone/legacy engines out of the first image to reduce build and runtime
# surface while retaining a complete modern PassWall2 installation.
CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy=n
CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Hysteria=n
CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client=n
CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server=n
CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Client=n
CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Server=n
CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Simple_Obfs=n
CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin=n

# Keep 802.11k/v neighbor exchange available on both APs. The first-boot
# profile deliberately disables all active kick/association steering so the
# client remains in charge of roaming unless the owner opts into more
# aggressive policy later.
CONFIG_PACKAGE_usteer=y

# 802.11s + SAE is a hard requirement for the dedicated 6 GHz backhaul.
# The device profile selects wpad-basic-mbedtls by default, so part2 removes
# every conflicting hostapd/wpad provider before these options are applied.
CONFIG_PACKAGE_wpad-mesh-openssl=y
CONFIG_PACKAGE_wireless-regdb=y
CONFIG_PACKAGE_iw-full=y
CONFIG_PACKAGE_tcpdump=y

# Read/write MDIO tooling for explicit maintenance diagnostics. No boot script
# invokes it and no register is changed automatically.
CONFIG_PACKAGE_phytool=y

# Optional Full Cone NAT capability. The kernel module and matching
# libnftnl/nftables/firewall4 support are installed, but firewall4 keeps both
# IPv4 and IPv6 Full Cone rules disabled until the owner opts in.
CONFIG_PACKAGE_kmod-nft-fullcone=y
